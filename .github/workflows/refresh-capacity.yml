name: Refresh Capacity Data

on:
  schedule:
    - cron: '30 3 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch capacity data
        working-directory: pipeline
        run: python fetch_capacity.py

      - name: Rebuild derived data
        working-directory: pipeline
        run: |
          python compute_readiness.py
          python build_countries.py
          python compute_risk.py
          python build_regions.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/capacity.json data/readiness.json data/countries.json data/risk.json data/regions.json
          git commit -m "data: refresh capacity data [automated]"
          git push
